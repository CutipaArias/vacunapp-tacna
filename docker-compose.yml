services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: vacunapp-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD en .env (copie .env.example)}"
      MSSQL_PID: "Developer"
      TZ: "America/Lima"
    ports:
      - "1433:1433"
    volumes:
      - vacunapp-data:/var/opt/mssql
      - ./database:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  vacunapp-data:
